# .github/workflows/ci-cd.yml
name: Security Dashboard CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: security-eks

jobs:
  # ─── Security Scanning ────────────────────────────────────────────────────
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Snyk – dependency vulnerability scan
      - name: Snyk – API dependencies
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=backend/api/package.json --severity-threshold=high

      - name: Snyk – ML dependencies
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=backend/ml/requirements.txt --severity-threshold=high

      # Snyk IaC scan
      - name: Snyk IaC – Terraform
        uses: snyk/actions/iac@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: infrastructure/terraform/

      # OWASP Dependency-Check
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'security-dashboard'
          path: '.'
          format: 'HTML'
          args: --suppression .owasp-suppressions.xml

      - name: Upload OWASP report
        uses: actions/upload-artifact@v3
        with:
          name: owasp-report
          path: reports/

  # ─── Test ────────────────────────────────────────────────────────────────
  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: security_db_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: changeme
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/api/package-lock.json
      - name: Install dependencies
        run: cd backend/api && npm ci
      - name: Run tests
        run: cd backend/api && npm test
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DB: security_db_test
          PG_USER: admin
          PG_PASS: changeme
          JWT_SECRET: test-secret
          NODE_ENV: test
      - name: Upload coverage
        uses: codecov/codecov-action@v3

  test-ml:
    name: ML Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r backend/ml/requirements.txt pytest
      - name: Run ML tests
        run: cd backend/ml && pytest tests/ -v

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & test
        run: |
          cd frontend
          npm ci
          npm run test -- --watchAll=false
          npm run build

  # ─── Build & Push Docker Images ──────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    needs: [security-scan, test-api, test-ml, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      api-image:      ${{ steps.api-meta.outputs.tags }}
      ml-image:       ${{ steps.ml-meta.outputs.tags }}
      frontend-image: ${{ steps.fe-meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api
          file: ./infrastructure/docker/Dockerfile.api
          push: true
          tags: ${{ env.ECR_REGISTRY }}/security-api:${{ github.sha }},${{ env.ECR_REGISTRY }}/security-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push ML image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/ml
          file: ./infrastructure/docker/Dockerfile.ml
          push: true
          tags: ${{ env.ECR_REGISTRY }}/security-ml:${{ github.sha }},${{ env.ECR_REGISTRY }}/security-ml:latest

      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./infrastructure/docker/Dockerfile.frontend
          push: true
          tags: ${{ env.ECR_REGISTRY }}/security-frontend:${{ github.sha }},${{ env.ECR_REGISTRY }}/security-frontend:latest

  # ─── Trivy Container Scanning ─────────────────────────────────────────────
  trivy-scan:
    name: Trivy Container Scan
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/security-api:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-api.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan ML image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/security-ml:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-ml.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-api.sarif

  # ─── OWASP ZAP DAST Scan ─────────────────────────────────────────────────
  zap-scan:
    name: OWASP ZAP DAST
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: 'https://staging.security.yourdomain.com'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: report_html.html

  # ─── Deploy to Staging ───────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: [build-and-push, trivy-scan]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy to staging namespace
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" infrastructure/kubernetes/security-dashboard.yaml
          kubectl apply -f infrastructure/kubernetes/security-dashboard.yaml -n staging
          kubectl rollout status deployment/api -n staging --timeout=300s
          kubectl rollout status deployment/ml-service -n staging --timeout=300s

  # ─── Deploy to Production ────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging, zap-scan]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy to production with rolling update
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" infrastructure/kubernetes/security-dashboard.yaml
          kubectl apply -f infrastructure/kubernetes/security-dashboard.yaml -n security-dashboard
          kubectl rollout status deployment/api      -n security-dashboard --timeout=600s
          kubectl rollout status deployment/frontend -n security-dashboard --timeout=600s
          kubectl rollout status deployment/ml-service -n security-dashboard --timeout=600s

      - name: Notify deployment
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ Security Dashboard deployed to production — commit ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
